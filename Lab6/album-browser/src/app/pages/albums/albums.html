<h2>Albums</h2>

<div *ngIf="loading">Loading...</div>
<div *ngIf="error">{{ error }}</div>

<ul *ngIf="!loading">
  <li *ngFor="let album of albums">
    <a
  [routerLink]="['/albums', album.id]"
  [state]="{ album: album }"
  >
  <b>#{{ album.id }}</b> — {{ album.title }}
</a>
  </li> 
</ul>

<div *ngIf="error">
    {{ error }}
    <button (click)="ngOnInit()">Reload</button>
  </div>
